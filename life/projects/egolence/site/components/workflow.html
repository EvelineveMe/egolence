<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workflow Component</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D;color:#fff;font-family:'Satoshi',sans-serif;padding:40px}
.section{max-width:1200px;margin:0 auto}
.title{font-size:32px;margin-bottom:60px}
.logic-strip{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:80px}
.logic-strip::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,0.1)}
.step{position:relative;z-index:1;font-size:14px;color:#9CA3AF}
.node{width:8px;height:8px;border-radius:50%;background:#fff;margin:0 8px}
.node.active{background:#B388FF}
.cards{display:flex;gap:32px;overflow-x:auto}
.card{flex:0 0 220px;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.card video{width:100%;aspect-ratio:9/16;border-radius:12px;object-fit:cover}
.small-number{font-size:11px;color:#9CA3AF}
.card-title{font-size:16px}
.card-text{font-size:13px;color:#9CA3AF}
</style>
</head>
<body>
<div class="section">
  <div class="title">Authority Workflow Canvas</div>

  <div class="logic-strip">
    <div class="step" style="color:#B388FF;">01</div>
    <div class="node active" style="background:#B388FF;"></div>
    <div class="step">02</div>
    <div class="node"></div>
    <div class="step">03</div>
    <div class="node"></div>
    <div class="step">04</div>
    <div class="node"></div>
    <div class="step">05</div>
    <div class="node"></div>
    <div class="step">06</div>
  </div>

  <div style="position:relative;">
  <button onclick="this.parentNode.querySelector('.cards').scrollBy({left:-250,behavior:'smooth'})" style="position:absolute;left:-30px;top:40%;background:none;border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:50%;width:32px;height:32px;">‹</button>
  <button onclick="this.parentNode.querySelector('.cards').scrollBy({left:250,behavior:'smooth'})" style="position:absolute;right:-30px;top:40%;background:none;border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:50%;width:32px;height:32px;">›</button>
  <div class="cards">
    <div class="card">
      <div class="small-number">01</div>
      <div class="card-title">Intake</div>
      <div class="card-text">Platform connection & sync</div>
      <video src="../assets/dummy.mp4" autoplay muted loop playsinline></video>
    </div>

    <div class="card">
      <div class="small-number">02</div>
      <div class="card-title">Identity</div>
      <div class="card-text">Positioning calibration</div>
      <video src="../assets/dummy.mp4" autoplay muted loop playsinline></video>
    </div>

    <div class="card">
      <div class="small-number">03</div>
      <div class="card-title">Content Engine</div>
      <div class="card-text">Automated distribution</div>
      <video src="../assets/dummy.mp4" autoplay muted loop playsinline></video>
    </div>

    <div class="card">
      <div class="small-number">04</div>
      <div class="card-title">Analytics</div>
      <div class="card-text">Performance tracking</div>
      <video src="../assets/dummy.mp4" autoplay muted loop playsinline></video>
    </div>

    <div class="card">
      <div class="small-number">05</div>
      <div class="card-title">Inbound</div>
      <div class="card-text">Lead capture</div>
      <video src="../assets/dummy.mp4" autoplay muted loop playsinline></video>
    </div>

    <div class="card">
      <div class="small-number">06</div>
      <div class="card-title">Authority</div>
      <div class="card-text">Positioning reinforcement</div>
      <video src="../assets/dummy.mp4" autoplay muted loop playsinline></video>
    </div>
  </div>
</div>
</body>
</html>
