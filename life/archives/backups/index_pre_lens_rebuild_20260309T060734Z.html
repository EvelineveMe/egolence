<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Egolence</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- SVG Graph Definitions -->
<object type="image/svg+xml" data="assets/proof-graphs.svg" style="display:none;"></object>

<section class="section hero">
  <div class="container">
    <h1>Your Authority.<br/>Everywhere.<br/>Installed Once.</h1>
  </div>
</section>

<section class="section proof">
  <div class="container proof-grid">

    <div class="proof-item">
      <h3>Revenue Growth</h3>
      <svg viewBox="0 0 300 120" class="proof-graph">
        <use href="assets/proof-graphs.svg#graph-revenue"></use>
      </svg>
      <p>+620% in 90 days</p>
    </div>

    <div class="proof-item">
      <h3>Audience Expansion</h3>
      <svg viewBox="0 0 300 120" class="proof-graph">
        <use href="assets/proof-graphs.svg#graph-audience"></use>
      </svg>
      <p>3.4x inbound DMs</p>
    </div>

    <div class="proof-item">
      <h3>Content Reduction</h3>
      <svg viewBox="0 0 300 120" class="proof-graph">
        <use href="assets/proof-graphs.svg#graph-output"></use>
      </svg>
      <p>95% less manual posting</p>
    </div>

  </div>
</section>

</body>
</html>
